{{- if .Values.postgresqlTls.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "adminer.fullname" . }}-postgresql-tls-plugin
  labels:
    {{- include "adminer.labels" . | nindent 4 }}
data:
  001-postgresql-login-ssl.php: |
    <?php
    require_once('plugins/login-ssl.php');

    return new AdminerLoginSsl(['mode' => '{{ .Values.postgresqlTls.sslMode }}']);
{{- end }}

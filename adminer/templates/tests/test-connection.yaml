apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "adminer.fullname" . }}-test-connection"
  labels:
    {{- include "adminer.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox:1.37.0
      command: ['wget']
      args: ['{{ include "adminer.fullname" . }}:{{ .Values.service.port }}']
  restartPolicy: Never
